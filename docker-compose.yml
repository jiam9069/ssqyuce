services:
  lottery:
    build: .
    image: ssq-predictor:latest
    container_name: ssq-predictor
    # 内存限额 (2026-10-12): 实测 peak 371MB(anon 333MB) → 768m, 系数 2.07
    # LLM 推理+统计计算, LOTT_LLM_MAX_TOKENS=32000, 给足余量避免生成被截断。
    mem_limit: 768m
    memswap_limit: 1024m
    # ---- CPU 硬限额（2026-10-20，用户约束：闲时挖掘整机占用 ≤60%）----
    # 本 VPS 4 核。cpu_quota=240000 / cpu_period=100000 ⇒ 2.4 核 = 整机 60%。
    # 这是**内核级硬上限**，与 idle_mining.py 的闭环限流形成双保险：
    #   软控制（应用层）按真实 CPU 时间循环休眠，保证平稳不超；
    #   硬限额（cgroup）在软控制失效/异常时由内核兜住，绝不让它吃满 4 核。
    # 注意：限额作用于整个容器（含前台请求），2.4 核对本场景足够——
    # 实测前台接口响应 p99 < 300ms，闲时挖掘是唯一的重 CPU 任务。
    cpu_period: 100000
    cpu_quota: 240000
    ports:
      # W01（多用户 P0）：**只绑回环地址**，公网必须经 nginx(443) 反代。
      #
      # 原先是 `"18000:18000"` = 0.0.0.0:18000，实测 `ss -tlnp` 确认明文直连公网可达，
      # 且 `/docs` `/openapi.json` 不在 `/api/` 前缀下、天然绕过鉴权中间件
      #（U1 实测 `http://<ip>:18000/docs` → 200）。这意味着**任何加在应用层的鉴权
      # 都能被这个旁路绕开**。多用户上线前必须堵死。
      # nginx upstream 就是 `127.0.0.1:18000`（/etc/nginx/sites-enabled/ssq），故安全。
      - "127.0.0.1:18000:18000"
    volumes:
      - ./data:/app/data
    # 全部密钥/URL 只从同目录 .env 注入（compose 自动读取 .env 做变量替换；
    # 空值=未配置，系统自动降级为纯统计模型）。仓库与镜像不含任何凭据。
    environment:
      - TZ=Asia/Shanghai
      - PORT=18000
      - LOTT_SCHEDULER=${LOTT_SCHEDULER:-1}
      # P4：闲时挖掘必须透传，否则改 .env 不生效（与 LOTT_STRICT_MODE 同坑）。
      # 默认 0 = 关闭：新机制先观察再开。开启后由独立线程常驻跑，
      # 不受 LOTT_SCHEDULER 影响（两者语义不同）。
      - LOTT_IDLE_MINING=${LOTT_IDLE_MINING:-0}
      # P4 限流：整机 CPU 占空比目标（%）。本 VPS 4 核，用户约束 ≤60%。
      - LOTT_IDLE_CPU_PCT=${LOTT_IDLE_CPU_PCT:-60}
      # P4 节奏：每轮间隔秒数 / 每轮候选上限。3 天观察窗口用 120s×40 可全覆盖。
      - LOTT_IDLE_INTERVAL=${LOTT_IDLE_INTERVAL:-300}
      - LOTT_IDLE_BUDGET=${LOTT_IDLE_BUDGET:-40}
      - LOTT_BOOT_PREDICT=${LOTT_BOOT_PREDICT:-1}
      - LOTT_TOKEN=${LOTT_TOKEN:-}
      # W08：多用户鉴权。off = 只解析身份不拦截（灰度）；enforce = deny-by-default。
      #
      # V36（2026-10-24 审计 P0-5）：默认值 off → **enforce**。
      # 原默认 off 会让**无会话请求**走到 `db.resolve_tenant(None)` 的兜底分支 ——
      # 该分支返回**主管理员** uid（db.py:539-541），于是匿名访问
      # `/api/predict?regenerate=1` 会 DELETE 并重写主管理员的票单。
      # 灰度期这个默认可以理解，但前端登录层早已落地（W08 + MU-1/MU-2），
      # 继续默认关等于默认不安全。需要在无鉴权环境下跑（本地调试/单机试用）时，
      # 显式设 LOTT_AUTH_MODE=off。
      - LOTT_AUTH_MODE=${LOTT_AUTH_MODE:-enforce}
      # W08：一次性引导口令（把 bootstrap 行升级为主管理员）。
      # **没有任何默认值**：未配置则引导通道整个关闭。
      # 引导成功后必须从 .env 删除并重启（后端的 consume_bootstrap_token 只清进程内 env）。
      - LOTT_BOOTSTRAP_TOKEN=${LOTT_BOOTSTRAP_TOKEN:-}
      # MU-2：每用户 API Key 的加密主密钥（Fernet）。
      # **空值 = 容器首次启动时自动生成到 data/.secret_key（0600）**。
      # 生产建议在 .env 显式固定：换掉它会让所有已保存的用户 Key 解不开
      # （解密失败会安全降级为"未配置"，但用户需要重新填一次）。
      - LOTT_MASTER_KEY=${LOTT_MASTER_KEY:-}
      - LOTT_SESSION_TTL=${LOTT_SESSION_TTL:-1209600}
      - LOTT_COOKIE_NAME=${LOTT_COOKIE_NAME:-__Host-ssq_sid}
      # 生产经 nginx 443 → Secure 必须为 1（本地 http 调试才设 0）
      - LOTT_COOKIE_SECURE=${LOTT_COOKIE_SECURE:-1}
      # W01：文档端点默认关（/docs /redoc /openapi.json 不在 /api/ 前缀、绕过鉴权）。
      # 本地调试可临时设 LOTT_API_DOCS=1。
      - LOTT_API_DOCS=${LOTT_API_DOCS:-0}
      # W01：CORS 显式白名单（原 allow_origins=["*"]）。留空则用代码内默认白名单。
      - LOTT_CORS_ORIGINS=${LOTT_CORS_ORIGINS:-}
      - LOTT_LLM_BASE_URL=${LOTT_LLM_BASE_URL:-}
      - LOTT_LLM_API_KEY=${LOTT_LLM_API_KEY:-}
      - LOTT_LLM_MODEL=${LOTT_LLM_MODEL:-minimax-m3}
      - LOTT_LLM_MODEL_LIST=${LOTT_LLM_MODEL_LIST:-}
      - LOTT_LLM_EXTRA_MODELS=${LOTT_LLM_EXTRA_MODELS:-}
      - LOTT_LLM_SAMPLES=${LOTT_LLM_SAMPLES:-3}
      - LOTT_LLM_TIMEOUT=${LOTT_LLM_TIMEOUT:-60}
      - LOTT_LLM_LONG_TIMEOUT=${LOTT_LLM_LONG_TIMEOUT:-180}
      - LOTT_LLM_MAX_TOKENS=${LOTT_LLM_MAX_TOKENS:-32000}
      - LOTT_LLM_TOTAL_TIMEOUT=${LOTT_LLM_TOTAL_TIMEOUT:-75}
      - LOTT_LLM_EXTRA_BODY=${LOTT_LLM_EXTRA_BODY:-}
      - LOTT_LLM_EXTRA_BODY_MAP=${LOTT_LLM_EXTRA_BODY_MAP:-}
      - LOTT_N_TICKETS=${LOTT_N_TICKETS:-5}
      # ---- V11/V12：严格模式必须透传，否则改 .env 不生效 ----
      - LOTT_STRICT_MODE=${LOTT_STRICT_MODE:-0}
      - LOTT_BOOT_REFRESH_RULES=${LOTT_BOOT_REFRESH_RULES:-1}
      - LOTT_LIFECYCLE_K_DEMOTE=${LOTT_LIFECYCLE_K_DEMOTE:-2}
      - LOTT_LIFECYCLE_K_UPGRADE=${LOTT_LIFECYCLE_K_UPGRADE:-2}
      - LOTT_LIFECYCLE_MIN_DWELL=${LOTT_LIFECYCLE_MIN_DWELL:-3}
      # ---- V10：方法开关必须透传，否则「按文档改 .env 不生效」----
      # compose 只注入此处列出的变量；此前 LOTT_METHODS 等从未列出，
      # 导致用户改 .env 后容器内仍用代码默认（V10 前默认还是"全部启用"）。
      - LOTT_METHODS=${LOTT_METHODS:-}
      - LOTT_METHOD_MODE=${LOTT_METHOD_MODE:-production}
      - LOTT_LLM_ONLY_OUTPUT=${LOTT_LLM_ONLY_OUTPUT:-0}
      - LOTT_LLM_DISABLED=${LOTT_LLM_DISABLED:-0}
      - LOTT_COVERAGE_OBJECTIVE=${LOTT_COVERAGE_OBJECTIVE:-ev_conserving}
      - LOTT_COVERAGE_R=${LOTT_COVERAGE_R:-3}
      - LOTT_BET_MODE=${LOTT_BET_MODE:-single}
      - LOTT_BLUE_MODE=${LOTT_BLUE_MODE:-model}
      - LOTT_ML_ENABLED=${LOTT_ML_ENABLED:-1}
      - LOTT_ML_CAL_CV=${LOTT_ML_CAL_CV:-2}
      - LOTT_LLM_EVAL_ISSUES=${LOTT_LLM_EVAL_ISSUES:-60}
      - LOTT_LLM_EVAL_TICKETS=${LOTT_LLM_EVAL_TICKETS:-5}
      - LOTT_LLM_EVAL_SEED=${LOTT_LLM_EVAL_SEED:-42}
      - LOTT_LLM_EVAL_MODEL=${LOTT_LLM_EVAL_MODEL:-}
      - LOTT_LLM_EVAL_PRICE_PER_1M=${LOTT_LLM_EVAL_PRICE_PER_1M:-1.0}
      - LOTT_LLM_VERIFY_MODEL=${LOTT_LLM_VERIFY_MODEL:-}
      - LOTT_LLM_VERIFY=${LOTT_LLM_VERIFY:-1}
      - LOTT_NOTIFY_WEBHOOK=${LOTT_NOTIFY_WEBHOOK:-}
      - LOTT_NOTIFY_EMAIL_SMTP_HOST=${LOTT_NOTIFY_EMAIL_SMTP_HOST:-}
      - LOTT_NOTIFY_EMAIL_SMTP_PORT=${LOTT_NOTIFY_EMAIL_SMTP_PORT:-587}
      - LOTT_NOTIFY_EMAIL_SMTP_TLS=${LOTT_NOTIFY_EMAIL_SMTP_TLS:-1}
      - LOTT_NOTIFY_EMAIL_SMTP_USER=${LOTT_NOTIFY_EMAIL_SMTP_USER:-}
      - LOTT_NOTIFY_EMAIL_SMTP_PASSWORD=${LOTT_NOTIFY_EMAIL_SMTP_PASSWORD:-}
      - LOTT_NOTIFY_EMAIL_FROM=${LOTT_NOTIFY_EMAIL_FROM:-}
      - LOTT_NOTIFY_EMAIL_TO=${LOTT_NOTIFY_EMAIL_TO:-}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18000/api/health', timeout=5)"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"