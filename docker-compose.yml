services:
  lottery:
    build: .
    image: ssq-predictor:latest
    container_name: ssq-predictor
    ports:
      - "18000:18000"
    volumes:
      - ./data:/app/data
    # 全部密钥/URL 只从同目录 .env 注入（compose 自动读取 .env 做变量替换；
    # 空值=未配置，系统自动降级为纯统计模型）。仓库与镜像不含任何凭据。
    environment:
      - TZ=Asia/Shanghai
      - PORT=18000
      - LOTT_SCHEDULER=${LOTT_SCHEDULER:-1}
      - LOTT_BOOT_PREDICT=${LOTT_BOOT_PREDICT:-1}
      - LOTT_LLM_BASE_URL=${LOTT_LLM_BASE_URL:-}
      - LOTT_LLM_API_KEY=${LOTT_LLM_API_KEY:-}
      - LOTT_LLM_MODEL=${LOTT_LLM_MODEL:-minimax-m3}
      - LOTT_LLM_MODEL_LIST=${LOTT_LLM_MODEL_LIST:-}
      - LOTT_LLM_EXTRA_MODELS=${LOTT_LLM_EXTRA_MODELS:-}
      - LOTT_LLM_SAMPLES=${LOTT_LLM_SAMPLES:-3}
      - LOTT_N_TICKETS=${LOTT_N_TICKETS:-10}
      - LOTT_LLM_EVAL_ISSUES=${LOTT_LLM_EVAL_ISSUES:-60}
      - LOTT_LLM_EVAL_TICKETS=${LOTT_LLM_EVAL_TICKETS:-5}
      - LOTT_LLM_EVAL_SEED=${LOTT_LLM_EVAL_SEED:-42}
      - LOTT_LLM_EVAL_MODEL=${LOTT_LLM_EVAL_MODEL:-}
      - LOTT_LLM_EVAL_PRICE_PER_1M=${LOTT_LLM_EVAL_PRICE_PER_1M:-1.0}
      - LOTT_LLM_VERIFY_MODEL=${LOTT_LLM_VERIFY_MODEL:-}
      - LOTT_LLM_VERIFY=${LOTT_LLM_VERIFY:-1}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18000/api/health', timeout=5)"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"