# pytest.ini —— 测试分层配置（V40-infra，2026-10-25）
#
# 分层约定：
#   fast        非 slow 的全部测试（日常开发反馈子集：pytest -m "not slow"）
#   slow        >5s 的重量级单测（v31 神经穷尽、LLM 兼容等）
#   integration 起 FastAPI TestClient / 打 HTTP / SQLite 多连接的集成测试
#
# 约束（铁律）：分层只"分组"，不"跳过" —— 默认 addopts 不带 -m，
# 裸 `pytest tests` 的收集数与分层前完全一致。fast ≠ 完整测试，
# 全量验收必须跑全量（scripts/test_fast.sh 头注释同款警告）。
#
# -p no:cacheprovider：xdist 多 worker 并发写 .pytest_cache 有噪音，
# 且本仓库跑测试一律经 scripts/isolated_test.sh（临时副本环境），
# 缓存跨跑复用本就没有意义，禁掉干净。
[pytest]
testpaths = tests
addopts = -p no:cacheprovider
markers =
    fast: 非 slow 的全部测试（日常开发反馈子集，pytest -m "not slow"）
    slow: >5s 的重量级单测（如 v31 神经穷尽、LLM 兼容）；-m "not slow" 即 fast 子集
    integration: 起 app / 打 HTTP / SQLite 多连接的集成测试
